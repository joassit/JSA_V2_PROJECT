name: ingest_handedness_splits

# workflow_dispatch manual. Escribe SOLO en el schema propio
# (handedness_split_snapshot, team_strength). Camino 2 (dia-por-dia,
# 2026-07-20 -- ver docs/data_source_design.md): 1 llamada por
# equipo-fecha jugada (~24,300 en total, ~150 fechas x 30 equipos x 5
# temporadas) mas la resolucion de mano de cada pitcher rival -- mas
# barato que la version anterior (Camino 1, ahora confirmada rota).
# Se dispara con confirmacion explicita del usuario.
on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Recalcular TODO desde cero, incluso equipos que ya tengan
          filas (necesario la primera vez que se corre despues de
          migrar de Camino 1 a Camino 2 -- los datos viejos estan
          contaminados por el bug de sitCodes+byDateRange).
        type: boolean
        default: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_handedness_splits.py ${{ inputs.force && '--force' || '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
