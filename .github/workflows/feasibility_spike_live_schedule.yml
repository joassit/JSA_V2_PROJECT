name: feasibility_spike_live_schedule

# workflow_dispatch manual. Solo lectura contra statsapi.mlb.com
# (schedule con hydrate=probablePitcher) -- verifica el contrato real
# antes de comprometerse a construir el fetcher en vivo. Sin DB, sin
# secrets.
on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/feasibility_spike_live_schedule.py
