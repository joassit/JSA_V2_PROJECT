name: weather_candidate_audit

# workflow_dispatch manual. Corre Weather1 contra el historico real
# compartido (solo lectura + weather_snapshot propio) y persiste el
# resultado. Requiere que ingest_weather.yml ya haya corrido antes.
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_weather_candidate_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
