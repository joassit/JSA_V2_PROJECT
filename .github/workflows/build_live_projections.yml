name: build_live_projections

# workflow_dispatch manual O cron diario (autorizado explicitamente por
# el usuario, 2026-07-21, para correr sin intervencion manual). Arma el
# payload de cada juego del dia (OPS, ERA de abridor probable, ERA de
# bullpen ponderado por IP, park factor ya calculado, pronostico de
# clima) y aplica las formulas ADOPTADAS (T1b, Weather1, F1-Platt, ML1b,
# RL1-Platt) -- ver scripts/build_live_projections.py. Persiste cada
# corrida en `live_projection` (schema propio) ademas de imprimir JSON.
#
# 12:00 UTC (~7-8am hora del Este segun horario de verano) -- horario
# elegido para dar tiempo a que MLB publique los abridores probables del
# dia (tipicamente disponibles la noche anterior o temprano en la
# mañana), sin ser tan tarde como para perderse juegos con horario de
# tarde/dia.
# Dashboard: cada corrida escribe site/index.html (analysis/dashboard.py)
# y este workflow lo publica en GitHub Pages (branch gh-pages, via
# peaceiris/actions-gh-pages) -- pedido explicito del usuario, repo
# publico confirmado, 2026-07-22. Requiere un paso manual UNICO en la UI
# de GitHub (no automatizable via los tools de este entorno): Settings ->
# Pages -> Build and deployment -> Source: "Deploy from a branch" ->
# Branch: gh-pages / (root).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha YYYY-MM-DD (vacio = hoy)"
        required: false
        default: ""
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_live_projections.py --date "${{ github.event.inputs.date }}"
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.date != '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
      - run: python scripts/build_live_projections.py
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.date == '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
      - name: Publicar dashboard en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
