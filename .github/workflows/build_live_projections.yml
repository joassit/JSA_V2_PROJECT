name: build_live_projections

# workflow_dispatch manual. Arma el payload de cada juego del dia (OPS,
# ERA de abridor probable, ERA de bullpen ponderado por IP, park factor
# ya calculado) y aplica las formulas ADOPTADAS (T1b, F1) -- ver
# scripts/build_live_projections.py. Solo LEE ParkFactor de la base
# compartida (mismo rol de solo escritura en team_strength / solo
# lectura en public que el resto del proyecto) -- no escribe nada.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha YYYY-MM-DD (vacio = hoy)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_live_projections.py --date "${{ github.event.inputs.date }}"
        if: ${{ github.event.inputs.date != '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
      - run: python scripts/build_live_projections.py
        if: ${{ github.event.inputs.date == '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
