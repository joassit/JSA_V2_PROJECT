name: platt_calibration_audit

# workflow_dispatch manual. Corre la calibracion logistica (Platt
# scaling) para T1/F1/ML1 contra el historico real compartido (solo
# lectura) y persiste los 3 resultados en candidate_audit_result. Cero
# ingesta nueva -- ver scripts/run_platt_calibration_audit.py.
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_platt_calibration_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
