name: feasibility_spike_venues

# workflow_dispatch manual. Solo lectura contra statsapi.mlb.com --
# verifica si /venues/{id}?hydrate=location trae coordenadas reales antes
# de escribir cualquier mapeo de estadios a mano. Sin DB, sin secrets.
on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/feasibility_spike_venues.py
