name: t1_totals_candidate_audit

# workflow_dispatch manual. Solo lectura sobre el historico compartido
# (public.historical_game/historical_snapshot, GRANT SELECT del rol
# jsa_v2) + una fila de resultado en el schema propio team_strength
# (candidate_audit_result). Ninguna ingesta nueva, ningun dato de
# produccion tocado. Se dispara con confirmacion explicita del usuario
# ("avanzar con T1", 2026-07-20).
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_t1_totals_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
