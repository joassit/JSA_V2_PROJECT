name: ingest_weather

# workflow_dispatch manual. Ingiere clima real (temp_f/condition/wind)
# para los 13,101 juegos historicos via /feed/live (v1.1) -- 1 llamada
# por juego, paralelizado (12 workers). Timeout generoso: el ingest de
# Chase Rate (M2, payload pesado similar) tardo ~75 min para 25,621
# snapshots.
on:
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_weather.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
