name: m3_closer_era_candidate_audit

# workflow_dispatch manual. Solo lectura sobre historical_game/
# historical_snapshot (public) + closer_era_snapshot (propio) + una fila
# de resultado en candidate_audit_result. Sin ingesta nueva.
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_m3_closer_era_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
