name: diagnose_sitcodes_bydaterange

# workflow_dispatch manual. Diagnostico puntual sin DB (solo llamadas de
# lectura a statsapi.mlb.com) -- confirma si `sitCodes` tiene efecto real
# combinado con `stats=byDateRange`, gap detectado en el spike original
# (ver scripts/diagnose_sitcodes_bydaterange.py).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/diagnose_sitcodes_bydaterange.py
