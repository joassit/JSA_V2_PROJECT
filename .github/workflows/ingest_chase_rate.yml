name: ingest_chase_rate

# workflow_dispatch manual. Escribe SOLO en el schema propio
# (chase_rate_snapshot, team_strength). Costo real medido (run
# 29765267487, 2026-07-20): ~14-15 min por temporada (el JSON de
# playByPlay es mucho mas pesado que el boxscore diario de splits vs
# mano -- el spike de 1 sola llamada subestimo el costo bajo carga
# paralela sostenida) -- ~75 min para las 5 temporadas completas. El
# script salta equipos que ya tienen filas para esa temporada sin
# --force, asi que una corrida cancelada por timeout se puede
# re-disparar sin perder el trabajo ya hecho. Se dispara con
# confirmacion explicita del usuario.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Recalcular TODO desde cero, incluso equipos que ya tengan filas."
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_chase_rate.py ${{ inputs.force && '--force' || '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
