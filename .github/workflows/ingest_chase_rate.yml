name: ingest_chase_rate

# workflow_dispatch manual. Escribe SOLO en el schema propio
# (chase_rate_snapshot, team_strength). Costo estimado ~13,101 llamadas
# a MLB Stats API (1 por game_pk, cubre ambos equipos), ~0.12s cada una
# segun el spike real -- ~200s con 8 workers en paralelo. Se dispara con
# confirmacion explicita del usuario.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Recalcular TODO desde cero, incluso equipos que ya tengan filas."
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest_chase_rate.py ${{ inputs.force && '--force' || '' }}
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
