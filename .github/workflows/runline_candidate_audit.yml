name: runline_candidate_audit

# workflow_dispatch manual. Corre RL1 (crudo) + RL1b (lineal) + RL1-Platt
# (logistico) contra el historico real compartido (solo lectura) y
# persiste los 3 resultados. Cero ingesta nueva -- ver
# scripts/run_runline_candidate_audit.py.
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_runline_candidate_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
