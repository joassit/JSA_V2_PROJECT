name: t1b_calibrated_audit

# workflow_dispatch manual. Solo lectura sobre el historico compartido +
# una fila de resultado en el schema propio (candidate_audit_result).
# Sin ingesta nueva.
on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/run_t1b_calibrated_audit.py
        env:
          JSA_SHARED_DATABASE_URL: ${{ secrets.JSA_SHARED_DATABASE_URL }}
